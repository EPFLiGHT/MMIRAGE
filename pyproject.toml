[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mmirage"
version = "0.1.4"
description = "Modular Multimodal Intelligent Reformatting and Augmentation Generation Engine - Advanced platform for processing datasets using generative models including vision-language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Meditron team" }]

dependencies = [
  "transformers==5.3.0",
  "pyzmq==27.1.0",
  "uvloop==0.21.0; platform_system != 'Windows'",
  "fastapi==0.136.1",
  "openai==2.6.1",
  "partial-json-parser==0.2.1.1.post7",
  "sentencepiece==0.2.1",
  "msgspec==0.21.1",
  "nest-asyncio==1.6.0",
  "PyYAML==6.0.3",
  "json-repair==0.59.8",
  "tqdm==4.67.3",
  "datasets==4.8.5",
  "pyarrow==24.0.0",
  "huggingface_hub==1.14.0",
  "numpy==2.3.5",
  "fsspec==2026.2.0",
  "dacite==1.9.2",
  "pydantic==2.13.4",
  "jmespath==1.1.0",
  "Jinja2==3.1.6",
  "pillow==12.1.1",
  "typing_extensions==4.15.0",
  "humanize==4.15.0",
]

[project.optional-dependencies]
gpu = [
  "sglang==0.5.10",
  "sgl-kernel==0.3.21",
  "xgrammar==0.1.32",
  "compressed-tensors==0.15.0.1",
]

dev = [
  "ruff>=0.5.0",
  "black>=24.3.0",
  "mypy>=1.8.0",
  "ipykernel",
  "pytest",
]

[project.scripts]
mmirage = "mmirage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmirage"]

[tool.hatch.build.targets.sdist]
include = ["src/mmirage/**", "pyproject.toml", "README.md"]