name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: fabnemepfl
  REGISTRY: docker.io

jobs:
  build-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - path: docker/Dockerfile
            name: mmirage-git
            platforms: linux/amd64
          - path: docker/Dockerfile.cpu
            name: mmirage-git-cpu
            platforms: linux/amd64,linux/arm64

    environment: ${{ github.event_name != 'pull_request' && 'docker' || 'docker-ci' }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
            tool-cache: true
            docker-images: true
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            swap-storage: true

      - name: Check free space
        run: df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.path }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
