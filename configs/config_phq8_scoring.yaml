# PHQ-8 scoring of DAIC-style interview transcripts with Qwen2.5-7B.
# Typed, range-constrained output_schema (int 0-3) + pass-through renderer
# so scores are saved as integers.

processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen2.5-7B-Instruct
      tp_size: 1
      trust_remote_code: true
      disable_custom_all_reduce: true
    default_sampling_params:
      max_new_tokens: 256

loading_params:
  state_dir: .mmirage_state/phq8_transcripts_train
  datasets:
    - path: datasets/transcripts_train.jsonl
      type: JSONL
      output_dir: mmirage_outputs/phq8_transcripts_train
  num_shards: 1
  shard_id: 0
  batch_size: 16

processing_params:
  inputs:
    - name: participant_id
      key: participant_id
    - name: transcript
      key: transcript_text

  outputs:
    - name: phq8_scores
      type: llm
      output_type: JSON
      output_schema:
        NoInterest: { type: int, min: 0, max: 3 }
        Depressed: { type: int, min: 0, max: 3 }
        Sleep: { type: int, min: 0, max: 3 }
        Tired: { type: int, min: 0, max: 3 }
        Appetite: { type: int, min: 0, max: 3 }
        Failure: { type: int, min: 0, max: 3 }
        Concentrating: { type: int, min: 0, max: 3 }
        Moving: { type: int, min: 0, max: 3 }
      prompt: |
        You are a mental health assessment assistant.

        Based on the following conversation transcript, estimate PHQ-8 scores.

        Each category must be scored from:
        0 = Not at all
        1 = Several days
        2 = More than half the days
        3 = Nearly every day

        Return ONLY a valid JSON object in this exact format:

        {
            "NoInterest": int,
            "Depressed": int,
            "Sleep": int,
            "Tired": int,
            "Appetite": int,
            "Failure": int,
            "Concentrating": int,
            "Moving": int
        }

        Transcript:
        {{ transcript }}
  remove_columns: true
  output_schema:
    participant_id: "{{ participant_id }}"
    # Simple reference: the renderer passes the dict through as-is,
    # preserving int values (a nested template would stringify them).
    phq8_scores: "{{ phq8_scores }}"

execution_params:
  mode: local
  retry: false
  merge: true
