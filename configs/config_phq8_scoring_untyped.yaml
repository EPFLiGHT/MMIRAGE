# Buggy baseline: untyped output_schema (all fields default to str), kept to
# demonstrate the empty/garbage-scores failure mode fixed on this branch.
# A/B counterpart of config_phq8_scoring.yaml -- not for real runs.

processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen2.5-7B-Instruct
      tp_size: 1
      trust_remote_code: true
      disable_custom_all_reduce: true
    default_sampling_params:
      max_new_tokens: 256

loading_params:
  state_dir: .mmirage_state/phq8_transcripts_train_original
  datasets:
    - path: datasets/transcripts_train.jsonl
      type: JSONL
      output_dir: mmirage_outputs/phq8_transcripts_train_original
  num_shards: 1
  shard_id: 0
  batch_size: 16

processing_params:
  inputs:
    - name: participant_id
      key: participant_id
    - name: transcript
      key: transcript_text

  outputs:
    - name: phq8_scores
      type: llm
      output_type: JSON
      output_schema:
        - NoInterest
        - Depressed
        - Sleep
        - Tired
        - Appetite
        - Failure
        - Concentrating
        - Moving
      prompt: |
        You are a mental health assessment assistant.

        Based on the following conversation transcript, estimate PHQ-8 scores.

        Each category must be scored from:
        0 = Not at all
        1 = Several days
        2 = More than half the days
        3 = Nearly every day

        Return ONLY a valid JSON object in this exact format:

        {
            "NoInterest": int,
            "Depressed": int,
            "Sleep": int,
            "Tired": int,
            "Appetite": int,
            "Failure": int,
            "Concentrating": int,
            "Moving": int
        }

        Transcript:
        {{ transcript }}
  remove_columns: true
  output_schema:
    participant_id: "{{ participant_id }}"
    phq8_scores:
      NoInterest: "{{ phq8_scores.NoInterest }}"
      Depressed: "{{ phq8_scores.Depressed }}"
      Sleep: "{{ phq8_scores.Sleep }}"
      Tired: "{{ phq8_scores.Tired }}"
      Appetite: "{{ phq8_scores.Appetite }}"
      Failure: "{{ phq8_scores.Failure }}"
      Concentrating: "{{ phq8_scores.Concentrating }}"
      Moving: "{{ phq8_scores.Moving }}"

execution_params:
  mode: local
  retry: false
  merge: true
