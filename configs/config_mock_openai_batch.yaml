processors:
  - type: llm
    execution_mode: batch
    batch:
      provider: openai
      model: gpt-4o-mini
      max_chunk_bytes: 52428800
      metadata_output_path: tests/output/batch_metadata.jsonl
      credentials:
        api_key: ""

loading_params:
  datasets:
    - path: tests/mock_data/data.jsonl
      type: JSONL
      output_dir: tests/output/data_openai_batch

  num_shards: 1
  shard_id: 0
  batch_size: 64

processing_params:
  inputs:
    - name: text
      key: text

  outputs:
    - name: formatted_answer
      type: llm
      output_type: JSON
      output_schema:
        - question
        - answer
      prompt: |
        Generate one question and its corresponding answer using the following text:
        ```
        {{ text }}
        ```

  remove_columns: true
  output_schema:
    conversations:
      - role: "user"
        content: "{{ formatted_answer.question }}"
      - role: "assistant"
        content: "{{ formatted_answer.answer }}"