processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen3-0.6B
      tp_size: 1
      disable_custom_all_reduce: true
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      max_new_tokens: 256
      custom_params:
        chat_template_kwargs:
          enable_thinking: false

loading_params:
  state_dir: tests/output/data_repro/_pipeline_state
  datasets:
    - path: tests/mock_data/data.jsonl
      type: JSONL
      output_dir: tests/output/data_repro

  num_shards: 1
  shard_id: 0
  batch_size: 64

processing_params:
  inputs:
    - name: text
      key: text

  outputs:
    - name: extracted
      type: llm
      output_type: JSON
      output_schema:
        - summary
        - sentiment
        - key_entity
        - confidence_reason
      prompt: |
        Analyze the following text and extract four fields:
        - summary: a one-sentence summary of the text
        - sentiment: the emotional tone (positive, negative, or neutral)
        - key_entity: the main named entity mentioned
        - confidence_reason: a short explanation of why you are confident in this analysis

        Text:
        ```
        {{ text }}
        ```

  remove_columns: true
  output_schema:
    original_text: "{{ text }}"
    summary: "{{ extracted.summary }}"
    sentiment: "{{ extracted.sentiment }}"
    key_entity: "{{ extracted.key_entity }}"
    confidence_reason: "{{ extracted.confidence_reason }}"

execution_params:
  mode: local
  retry: false
  merge: true
  report_dir: ~/reports
  hf_home: ~/hf
