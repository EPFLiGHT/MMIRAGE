processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen3-4B-Instruct-2507
      tp_size: 4
      disable_custom_all_reduce: true
    default_sampling_params:
      temperature: 0.1
      top_p: 0.9
      max_new_tokens: 1024
    chat_template_kwargs:
      enable_thinking: false

loading_params:
  datasets:
    - path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/medtrinity_conversations_1/
      type: loadable
      output_dir: /capstor/store/cscs/swissai/a127/homes/qchapp/datasets/medtrinity//medtrinity_conversations_sampled2
    - path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/medtrinity_conversations_2/
      type: loadable
      output_dir: /capstor/store/cscs/swissai/a127/homes/qchapp/datasets/medtrinity//medtrinity_conversations_sampled2
  num_shards: 32
  shard_id: "$SLURM_ARRAY_TASK_ID"
  conversations_field: "conversations"
  batch_size: 128

processing_params:
  inputs:
    - name: assistant_answer
      key: conversations[1].content
    - name: user_prompt
      key: conversations[0].content
    - name: modalities
      key: modalities

  outputs:
    - name: formatted_answer
      type: llm
      output_type: plain
      prompt: |
        You will receive a JSON object with a single field "assistant_text".

        Task:
        - Rewrite "assistant_text" as clearer, well-structured **Markdown**.
        - You may add headings, bullet points, and simple formatting to improve readability.
        - Keep the original meaning; do **not** invent new facts or interpretations.

        Output:
        - Return only the rewritten Markdown text as a plain string.
        - Do NOT wrap it in JSON, quotes, or code fences.

        Input:
        {{ assistant_answer }}
      output_schema:
        - question
        - explanation
        - answer
        
  remove_columns: True
  output_schema:
    conversations:
      - role: user
        content: "{{ user_prompt }}"
      - role: assistant
        content: "{{ formatted_answer }}"
    modalities: "{{ modalities }}"