processors:
  - type: api_llm
    model: openai/gpt-4o-mini
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_sampling_params:
      temperature: 0.1
      max_tokens: 1024
    max_concurrency: 4

loading_params:
  datasets:
    - path: tests/mock_data/data.jsonl
      type: JSONL
      output_dir: tests/output/data_api_llm

  num_shards: 1
  shard_id: 0
  batch_size: 4

processing_params:
  inputs:
    - name: text
      key: text

  outputs:
    - name: formatted_answer
      type: api_llm
      output_type: JSON
      output_schema:
        - question
        - answer
      prompt: |
        Generate one question and its corresponding answer using the following text:
        ```
        {{ text }}
        ```

  remove_columns: true
  output_schema:
    conversations:
      - role: "user"
        content: "{{ formatted_answer.question }}"
      - role: "assistant"
        content: "{{ formatted_answer.answer }}"
